; Per-biome Shovel Toughness requirement for Prospecting.
;
; WHY THIS FILE EXISTS
;   A biome has a strict Toughness Level. If your shovel's Dig Strength is BELOW
;   the area's requirement, you cannot extract anything from that ground at all -
;   the macro will walk and click and achieve precisely nothing, which looks
;   identical to a broken macro. So the macro reads this file and WARNS when the
;   active map is above your shovel, instead of failing silently.
;
; HOW THE MACRO USES IT
;   Set your shovel's tier once:
;       [options]
;       shovelTier=4
;   in settings\vortex_config.ini. Tiers are 0-7 and "0" means "not set", which
;   disables the check entirely - the macro will not guess.
;
; FORMAT
;   <Location>=T<n>    requirement of n
;   <Location>=N0      no requirement (safe everywhere)
;   absent             NOT CHECKED (see the bottom of this file)
;
;   Where a zone's ENTRY requirement differs from its richer sub-areas, the number
;   used is the entry requirement and the range is noted in a comment. The check is
;   a warning, not a block, so erring toward letting you work a map is deliberate.
;
; SOURCE
;   Tiers are the ones the player stated. Anything they did not state is LEFT OUT
;   rather than guessed: a wrong tier would warn you off a biome you can actually
;   work, which is worse than not checking. Add entries as you confirm them.

[tiers]

; --- no requirement: starter town and service areas ---
Spawn=N0
Town=N0
Store=N0
Dock=N0
Sluice Shack=N0
Shack=N0

; --- stated tiers ---
; Rubble Creek is Toughness 1 at the surface and 2 deeper in. The value here is the
; ENTRY requirement, so a tier-1 shovel may work the shallow deposits.
Rubble Creek=T1
Sunset Beach=T3
Fortune River Delta=T4
Volcanic Sands=T4
Crystal Cavern River=T4
Azuralite Oasis=T5
; Endgame swamp zone.
Fungal Marsh=T7
Fungal Marsh / Wastes=T7

; --- CONFLICT, needs the player to confirm ---
; The player's structured location list says "Fortune River (Toughness 3): the
; central hub town", but their tiers file said T4. T3 is used below because the
; structured list was the more deliberate statement. If Fortune River really is T4,
; change this line - it only affects whether the macro warns you there.
Fortune River=T3

; ---------------------------------------------------------------------------
; ALIASES for the reference macro's deposit-level names
; ---------------------------------------------------------------------------
; The reference macro routes by DEPOSIT AREA, not by zone. If a map file still
; carries one of those names the tier lookup must resolve it, or that map runs
; silently unchecked.
Rubble Creek Sands=N0
Rubble Creek Deposits=N0
Rubble Creek Sluice=N0

; ---------------------------------------------------------------------------
; NOT CHECKED - no toughness stated by the player.
; ---------------------------------------------------------------------------
;   Windswept Beach      Caldera Park         Caldera Island
;   Rotwood Swamp        Snowy Mountain       Meteor Valley
;   Sunscorched Desert   Crystal Caverns      Overgrown Caves
;   Abyssal Depths       The Museum           Time Locked Sanctuary
;   Magma Furnace        Volcanic Springs     Frozen Peak
;   Frostbite River      Frostbite Waterfall  The Void
;   North Pole           Waterfall Temple     Underground Maze
;   Infernal Heart       Deeproot Spring      Haunted Creek
;   Snowy Shores         Enchanted Ruins      Frostbitten Path
;   Mysterious Altar     Volcano
;
; Add a line above the moment you know the number. Until then these maps simply
; run without a tier check rather than being warned off on a guess.
