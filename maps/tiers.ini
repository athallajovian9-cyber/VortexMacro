; Per-biome Shovel Toughness requirement for Prospecting.
;
; WHY THIS FILE EXISTS
;   A biome has a strict Toughness Level. If your shovel's Dig Strength is BELOW
;   the area's requirement you cannot extract anything from that ground at all -
;   the macro will walk and click and achieve precisely nothing, which looks
;   identical to a broken macro. So the macro reads this file and WARNS when the
;   active map is above your shovel, instead of failing silently.
;
; HOW THE MACRO USES IT
;   Set your shovel's tier once:
;       [options]
;       shovelTier=4
;   in settings\vortex_config.ini. "0" means "not set", which disables the check -
;   the macro does not guess.
;
; FORMAT
;   <Location>=T<n>        requirement of n
;   <Location>=T<n>-<m>    a RANGE. The macro enforces n, the ENTRY requirement, so
;                          a shovel that can enter the biome is never warned off it.
;   <Location>=N0          no requirement (safe everywhere)
;   absent                 NOT CHECKED
;
;   Zones that vary by sub-area carry their full range. The check is a warning, not
;   a block, so erring toward letting you work a map is deliberate.
;
; SOURCE
;   Ranges are the game's own progression data. Anything not covered is LEFT OUT
;   rather than guessed: a wrong tier warns you off a biome you can actually work,
;   which is worse than not checking.

[tiers]

; --- no requirement: starter town and service areas ---
Spawn=N0
Town=N0
Store=N0
Dock=N0
Sluice Shack=N0
Shack=N0

; ===========================================================================
; EARLY GAME  (Toughness 1-3)
; ===========================================================================
; Summer-event zone, very beginner friendly.
Seashell Beach=T1
; The starting area. 1 at the surface, 2 deeper in, so entry is 1 - a tier-1
; shovel may work the shallow deposits.
Rubble Creek=T1-2
; NOTE: this RESOLVES an earlier contradiction. One source said Fortune River was
; Toughness 3, another said 4. It is a 3-4 range: entry 3, richer sub-areas 4. The
; entry value is enforced, so a T3 shovel is not warned off the hub town.
; "Requires the Reinforced Shovel to cross the river efficiently."
Fortune River=T3-4

; ===========================================================================
; MID GAME  (Toughness 4-6)
; ===========================================================================
Sunset Beach=T3-5
; Unlocks at level 15; a major early-mid mining hub.
Crystal Caverns=T3-5
Caldera Park=T4-6
Caldera Island=T4-6
; Home of the Blizzard event and Frozen Peak.
Snowy Mountain=T4-6
; TIMED EVENT: opens every hour at XX:15.
Magma Furnace=T5
Overgrown Grotto=T6
Overgrown Caves=T6
Enchanted Ruins=T6
Frostbitten Path=T6
Frozen Peak=T6

; ===========================================================================
; LATE AND END GAME  (Toughness 7-11+)
; ===========================================================================
; Requires level 30+ and clearing the vines.
Rotwood Swamp=T7-8
Rotwood Swamp & Marsh=T7-8
Deeproot Spring=T7
; Found deep behind the Overgrown Grotto.
Abyssal Depths=T7-8
; TIMED EVENT: opens at XX:45.
Timelocked Sanctuary=T8
; Home of the Starfall River.
Meteor Valley=T8-10
; The peak natural zone; very active during Sandstorms.
Sunscorched Desert=T10-11

; ===========================================================================
; STATED EARLIER, FOR COMPLETENESS
; ===========================================================================
Windswept Beach=T4
Volcanic Sands=T4
Crystal Cavern River=T4
Fortune River Delta=T4
Azuralite Oasis=T5
Fungal Marsh=T7
Fungal Marsh / Wastes=T7

; ===========================================================================
; NOT CHECKED - deliberately
; ===========================================================================
;   The Void        Event-scaled: toughness varies with the seasonal equipment
;   North Pole      tier update, so there is no fixed number to encode.
;   Museum          No requirement stated.
;
; ===========================================================================
; ALIASES for the reference macro's deposit-level names
; ===========================================================================
; The reference routes by DEPOSIT AREA, not by zone. If a map file still carries one
; of those names the lookup must resolve it, or that map runs silently unchecked.
Rubble Creek Sands=N0
Rubble Creek Deposits=N0
Rubble Creek Sluice=N0
