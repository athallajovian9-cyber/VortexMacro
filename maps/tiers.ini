; Per-biome Shovel Toughness requirement for Prospecting.
;
; WHY THIS FILE EXISTS
;   A biome has a strict Toughness Level. If your shovel's Dig Strength is BELOW
;   the area's requirement, you cannot extract anything from that ground at all -
;   the macro will walk and click and achieve precisely nothing, which looks
;   identical to a broken macro. The macro reads this file and refuses to run a
;   map your shovel cannot work, instead of failing silently.
;
; HOW THE MACRO USES IT
;   Set your shovel's tier once:
;       [options]
;       shovelTier=4
;   in settings\vortex_config.ini. The macro then checks the active map against
;   this table. Tiers are 0-7. "0" means "not set", which disables the check -
;   the macro will not guess.
;
; Values below are from the game's own progression data. Add or correct entries
; freely; a map missing from this file is simply not checked.
;
; T = Toughness Level of the biome.

[tiers]
; --- known from the game's progression map ---
Rubble Creek=N0
Rubble Creek Sands=N0
Rubble Creek Deposits=N0
Rubble Creek Sluice=N0
Sluice Shack=N0
Shack=N0
Spawn=N0
Town=N0
Store=N0
Dock=N0
Sunset Beach=T3
Crystal Cavern River=T4
Fortune River Delta=T4
Fortune River=T4
Azuralite Oasis=T5
Fungal Marsh=T7
Fungal Marsh / Wastes=T7

; --- not documented in the progression data I have. Left out deliberately
;     rather than guessed: a wrong tier would block a map you CAN work, which is
;     worse than not checking.
;   Deeproot Spring, Enchanted Ruins, Frostbitten Path, Frozen Peak, Haunted Creek,
;   Infernal Heart, Magma Furnace, Museum, Mysterious Altar, North Pole,
;   Overgrown Grotto, Rotwood Swamp, Snowy Mountains, Snowy Shores,
;   The Void, Timelocked Sanctuary, Volcanic Sands, Volcanic Springs,
;   Volcano, Waterfall, Temple, Windswept Beach, Deeproot Spring
