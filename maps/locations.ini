; CANONICAL LOCATION LIST for Prospecting
;
; Source: the player's own list of in-game areas. This supersedes the 37 map stubs
; this project shipped with, which were a mix of outdated and invented names.
;
; WHY THIS FILE EXISTS
;   maps/*.ini and maps/*.path are named after locations, so the names have to be
;   right or the macro loads the wrong route for a map. This is the single source
;   of truth the map files should be rebuilt from.
;
; KIND
;   overworld  - a main map area you dig in
;   cavern     - a separate subterranean map, progression-gated
;   special    - a landmark, shop or instance
;
; TIER
;   Toughness Level where the player's list states one. "-" = not stated.
;   A biome above your shovel's tier yields NOTHING, so the macro warns rather
;   than running a doomed loop (see _TierCheck in the macro).
;
; GROUP
;   For entries the player listed as one area with several names
;   ("Frozen Peak / Frostbite River"), all names are kept as aliases of the
;   canonical entry, because the macro's map files must use whichever name the
;   game itself uses.

[overworld]
Rubble Creek=T1-2
Fortune River=T3
Fortune River Delta=T4
Sunset Beach=T3
Windswept Beach=-
Volcanic Sands=T4
Caldera Park=-
Caldera Island=-
Rotwood Swamp=-
Snowy Mountain=-
Meteor Valley=-
Sunscorched Desert=-

[cavern]
Crystal Caverns=-
Crystal Cavern River=T4
Azuralite Oasis=T5
Overgrown Grotto=-
Overgrown Caves=-
Abyssal Depths=-

[special]
Sluice Shack=-
The Museum=-
Time Locked Sanctuary=-
Magma Furnace=-
Volcanic Springs=-
Frozen Peak=-
Frostbite River=-
Frostbite Waterfall=-
The Void=-
North Pole=-

[aliases]
; player-list name (lowercased) = canonical entry
swamp & marsh=Rotwood Swamp
snowy mountains=Snowy Mountain
caldera park / caldera island=Caldera Park
overgrown caves / overgrown grotto=Overgrown Grotto
magma furnace & volcanic springs=Magma Furnace
frozen peak / frostbite river=Frozen Peak
the museum=Museum
time locked sanctuary=Time Locked Sanctuary

