; GEAR TABLE — what the player is carrying, so the macro does not have to be told
; the same thing twice.
;
; WHY THIS FILE EXISTS
;   For this game, your gear DETERMINES the numbers the macro needs:
;
;     Shovel -> Dig Strength -> which biomes you can dig   (the toughness gate)
;            -> Dig Speed    -> how long to hold for a dig (the `dig` formula)
;
;     Pan    -> Capacity, Shake Strength, Shake Speed -> how the panning clicks
;               should be paced
;
;   Set the shovel once and the macro derives both the toughness check AND the dig
;   hold from it, instead of the player hand-typing shovelTier=4 and `dig 140`.
;
;   This is the pattern Natro Macro uses for its per-field selectors - a name maps
;   to a bundle of parameters - applied to gear. Natro itself has no gear selectors
;   at all (it is a Bee Swarm macro; that game has no shovels), so this part is ours.
;
; HONESTY RULE FOR THIS FILE
;   "?" means NOT KNOWN. Do not guess a value to fill a gap: a wrong Dig Speed makes
;   every dig miss the green zone, and a wrong Toughness either blocks a biome you can
;   work or lets you waste a run in one you cannot. A "?" is honest and safe - the
;   macro falls back to whatever is set manually.
;
; STAT MEANINGS
;   digStrength  : unlocks biomes. Compared against a biome's Toughness.
;   digSpeed     : drives the slider speed -> the dig hold calculation.
;   toughness    : the shovel's own rating.
;   luck         : pan luck stat (feeds the reroll).
;   capacity     : how much sand one pan fill holds.
;   shakeStrength: how far each panning click advances the shake bar.
;   shakeSpeed   : how fast the shake bar can be advanced.
;   modBoost     : modifier chance boost.
;   sizeBoost    : ore size boost (negative = penalty).

[shovels]
; name = digStrength, digSpeed, toughness, price, where to buy
Rusty Shovel      = 1, 0.8, 1, 0,      Starting shovel
Iron Shovel       = 2, 0.8, 1, 3000,   Rubble Town Shopkeeper
Steel Shovel      = 3, 0.8, 2, 25000,  Rubble Town Shopkeeper
Silver Shovel     = 4, 1.1, 2, 75000,  Rubble Town Shopkeeper
Reinforced Shovel = 5, 0.9, 3, 135000, Rubble Town Shopkeeper
The Excavator     = 7, 0.7, 3, 320000, Fortune River Shopkeeper
Golden Shovel     = ?, ?, ?, ?,        Rubble Town Shopkeeper
; --- everything past this point is NOT in the data I have. Fill in from the game
;     and the selector will offer it; until then these names exist but carry no stats.
Earth Breaker Shovel   = ?, ?, ?, ?, Hidden Crystal Caverns shop (Emerald+Diamond+Starfire)
Dragonflame Shovel     = ?, ?, ?, ?, endgame
; add more as you find them

[pans]
; name = luck, capacity, shakeStrength, shakeSpeed, modBoost, sizeBoost
Plastic Pan    = 1.5, 10,  0,   80,  -,  -
Metal Pan      = 2,   20,  0.5, 80,  -,  -
Silver Pan     = 4,   30,  0.8, 90,  -,  -
Golden Pan     = 10,  35,  1,   80,  -,  -
Magnetic Pan   = 15,  50,  1,   75,  25, -
Meteoric Pan   = 22,  70,  2,   100, 25, -
Diamond Pan    = 35,  100, 3,   100, 10, 10
Aurora Pan     = 50,  130, 3,   125, 25, -
Dragonflame Pan= 150, 180, 10,  110, -,  -10

[sluicers]
; Placeable in flowing water for offline income. Does not change the dig/pan input
; sequence, so it carries no input stats - recorded for completeness.
Beginner Sluice = Sluice Shack, at Spawn
; add the rest as you find them

[selected]
; Which gear is equipped. Written by the macro's selectors; read by the macro.
; "?" means nothing selected, and every derived value falls back to what is set
; manually in the config.
shovel = ?
pan    = ?
sluicer= ?
